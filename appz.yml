app:
  name: MongoDB
  code: MONGODB
  notify: srswain@ecloudcontrol.com

build:
  version: 6.0
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: mongo-8.0
  
deploy:
  context: sranjan1995/DEV
  type: statefulset
  replicas: 1
  port:
  - 27017

volumes:
- claim: mongo-data
  mount: /appz/data
  name: mongo-data
  size: 5Gi
  mode: ReadWriteOnce
- claim: mongo-key
  mount: /appz/keys
  name: key
  size: 5Gi 
  
properties:
  revision : 9
  REPLICA_SET_NAME : rs0
  AUTH_ENABLE : 0
  DB_USER_ADMIN : appz
  DB_USER_ADMIN_PASSWORD : 
    vault : DB_USER_ADMIN_PASSWORD
  MONGODB_HOST : 127.0.0.1
  MONGODB_PORT : 27017
  MASTER_ENABLE : no
  REPLICATION: 0
  AUTH_KEY: 
    vault: AUTH_KEY
  ENCRYPTION_KEY:
    vault: ENCRYPTION_KEY
